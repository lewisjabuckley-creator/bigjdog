# JARVIS configuration example.
#
# Copy to ./jarvis.toml or ~/.jarvis/jarvis.toml (or point $JARVIS_CONFIG at it).
# Every key is optional; anything omitted keeps its safe default.
# Unknown keys are rejected so a typo can't silently weaken a setting.
# Never put secrets here: reference environment variable names instead.

[general]
data_dir = "~/.jarvis"          # database, logs, backups, trash, emergency evidence
user = "owner"
default_mode = "normal"         # normal | focus | development | research | presentation | ...

[models.ollama]
enabled = true
base_url = "http://127.0.0.1:11434"
keep_alive = "5m"
request_timeout_s = 300

# Optional: any OpenAI-compatible endpoint (llama.cpp server, vLLM, LM Studio, or a cloud API).
[models.openai_compatible]
enabled = false
name = "openai_compatible"
base_url = "http://127.0.0.1:8080/v1"
api_key_env = ""                # e.g. "OPENAI_API_KEY" — the variable name, never the key itself
local = true                    # false for cloud endpoints (excluded in private mode / sensitive projects)
models = []

# Ordered preferences per purpose. Missing models are skipped; if none match, the router
# picks any installed model with the required capability (small for simple work, large for complex).
[models.profiles]
conversation = ["llama3.1:8b", "qwen2.5:7b", "llama3.2:3b"]
reasoning = ["qwen2.5:32b", "qwen2.5:14b", "llama3.1:8b"]
planning = ["qwen2.5:14b", "llama3.1:8b"]
coding = ["qwen2.5-coder:14b", "qwen2.5-coder:7b"]
vision = ["llama3.2-vision", "llava:13b"]
summarization = ["llama3.2:3b"]
classification = ["llama3.2:3b"]
background = ["llama3.2:3b"]
embedding = ["nomic-embed-text"]

[permissions]
# Highest level auto-approved for actions that directly serve an explicit request from you:
# 0 observe, 1 recommend, 2 prepare, 3 reversible execution. Level 4 (consequential) and 5
# (autonomous) are never blanket-approved: they need your approval or a scoped grant.
interactive_level = 3
automation_level = 1            # baseline for automations and agents without grants
allowed_roots = ["~"]           # registered project folders are added automatically
denied_paths = ["~/.ssh", "~/.gnupg", "~/.aws", "~/.azure", "~/.kube", "~/.config/gcloud", "~/.jarvis/secrets"]
approval_timeout_s = 3600

[tasks]
max_concurrent = 4
max_retries = 2

[monitoring]
enabled = true
system_interval_s = 10
model_interval_s = 30
network_interval_s = 30
network_probe_host = "1.1.1.1"
network_probe_port = 443

# Sustained thresholds distinguish persistent problems from transient spikes.
[monitoring.thresholds]
cpu_percent = { value = 90, sustain_s = 300 }
memory_percent = { value = 90, sustain_s = 120 }
disk_percent = { value = 90 }
disk_critical_percent = { value = 97, severity = "critical" }   # critical => emergency mode
battery_low_percent = { value = 15 }

[notifications]
max_interrupts_per_window = 5
interrupt_window_s = 600
dedupe_window_s = 1200

[memory]
enabled = true
use_embeddings = true           # uses the embedding profile when a model is installed
max_context_items = 6

[privacy]
private_mode = false            # local models only, network tools disabled
allow_cloud = false             # optional cloud adapters are opt-in

[ui]
verbosity = "normal"            # short | normal | detailed
use_sir = false
humor = true
