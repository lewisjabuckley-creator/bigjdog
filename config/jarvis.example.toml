# JARVIS configuration example.
#
# Copy to ./jarvis.toml or ~/.jarvis/jarvis.toml (or point $JARVIS_CONFIG at it).
# Every key is optional; anything omitted keeps its safe default.
# Unknown keys are rejected so a typo can't silently weaken a setting.
# Never put secrets here: reference environment variable names instead.

[general]
data_dir = "~/.jarvis"          # database, logs, backups, trash, emergency evidence
user = "owner"
default_mode = "normal"         # normal | focus | development | research | presentation | ...

[models.ollama]
enabled = true
base_url = "http://127.0.0.1:11434"
keep_alive = "5m"
request_timeout_s = 300
num_ctx = 8192                  # context window requested from Ollama (its default is too small for JARVIS)
options = {}                    # extra sampling options, e.g. { temperature = 0.3, seed = 7 }

# Optional: any OpenAI-compatible endpoint (llama.cpp server, vLLM, LM Studio, or a cloud API).
[models.openai_compatible]
enabled = false
name = "openai_compatible"
base_url = "http://127.0.0.1:8080/v1"
api_key_env = ""                # e.g. "OPENAI_API_KEY" — the variable name, never the key itself
local = true                    # false for cloud endpoints (excluded in private mode / sensitive projects)
models = []

# Ordered preferences per purpose. Missing models are skipped; if none match, the router
# picks any installed model with the required capability (small for simple work, large for complex).
[models.profiles]
conversation = ["llama3.1:8b", "qwen2.5:7b", "llama3.2:3b"]
reasoning = ["qwen2.5:32b", "qwen2.5:14b", "llama3.1:8b"]
planning = ["qwen2.5:14b", "llama3.1:8b"]
coding = ["qwen2.5-coder:14b", "qwen2.5-coder:7b"]
vision = ["llama3.2-vision", "llava:13b", "llava", "moondream"]
summarization = ["llama3.2:3b"]
classification = ["llama3.2:3b"]
background = ["llama3.2:3b"]
embedding = ["nomic-embed-text"]

[permissions]
# Highest level auto-approved for actions that directly serve an explicit request from you:
# 0 observe, 1 recommend, 2 prepare, 3 reversible execution. Level 4 (consequential) and 5
# (autonomous) are never blanket-approved: they need your approval or a scoped grant.
interactive_level = 3
automation_level = 1            # baseline for automations and agents without grants
allowed_roots = ["~"]           # registered project folders are added automatically
denied_paths = ["~/.ssh", "~/.gnupg", "~/.aws", "~/.azure", "~/.kube", "~/.config/gcloud", "~/.jarvis/secrets"]
approval_timeout_s = 3600

[tasks]
max_concurrent = 4
max_retries = 2

[monitoring]
enabled = true
system_interval_s = 10
model_interval_s = 30
network_interval_s = 30
network_probe_host = "1.1.1.1"
network_probe_port = 443

# Sustained thresholds distinguish persistent problems from transient spikes.
[monitoring.thresholds]
cpu_percent = { value = 90, sustain_s = 300 }
memory_percent = { value = 90, sustain_s = 120 }
disk_percent = { value = 90 }
disk_critical_percent = { value = 97, severity = "critical" }   # critical => emergency mode
battery_low_percent = { value = 15 }

[notifications]
max_interrupts_per_window = 5
interrupt_window_s = 600
dedupe_window_s = 1200

[memory]
enabled = true
use_embeddings = true           # uses the embedding profile when a model is installed
max_context_items = 6

[privacy]
private_mode = false            # local models only, network tools disabled
allow_cloud = false             # optional cloud adapters are opt-in

[ui]
verbosity = "normal"            # short | normal | detailed
use_sir = false
humor = true

# -- the persistent runtime (docs/RUNTIME.md) ---------------------------------------------------------
[runtime]
api_host = "127.0.0.1"          # loopback only; the API is never exposed to the network
api_port = 0                    # 0 = any free port (written to runtime.json in the data directory)
heartbeat_s = 10
presence_timeout_s = 30         # an interface silent this long counts as closed
auto_start = true               # `jarvis` starts the runtime in the background when it isn't running
recovery_max_age_s = 86400      # interrupted work older than this waits for you instead of resuming

[scheduler]
tick_s = 5
catch_up_window_s = 21600       # runs missed while JARVIS was down are made up once if this recent

[resources]
memory_critical = 92            # percent; above this only P0-P2 work starts
cpu_critical = 97
vram_critical = 90
low_priority_policy = "pause"   # pause | wait (finish the current step first) | slow (one keeps going) | continue
self_memory_warn_mb = 1500      # warn when JARVIS itself uses this much memory

[briefing]
enabled = false                 # prepare a morning briefing on a schedule
time = "07:30"
days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]

# -- images, screenshots, documents and the screen (docs/PHASE4.md) -------------------------------------
[perception]
enabled = true
ocr = "auto"                    # auto | tesseract | vision | off (Tesseract is found on PATH or in Program Files)
tesseract_path = ""
allow_cloud_vision = false      # also needs [privacy] allow_cloud = true; never for private inputs or screen captures
max_input_mb = 40
max_image_side = 1568           # images are shrunk to this before a vision model sees them (needs Pillow)
max_concurrent_vision = 1       # vision is heavy: one analysis at a time
retention_days = 7              # stored copies of what you shared; what was learned from them is kept
screen_retention_days = 1
remember_findings = true        # important findings become memories (never the images themselves)
screen_mode = "off"             # off | on_request | watching; you switch it in conversation ("watch my screen")
screen_interval_s = 30          # watching: how often the active window is checked
screen_capture_every = 4        # watching: a full capture + OCR at most every Nth check, or when something changes
document_max_chars = 12000      # document text handed to a model in one request
